server {
    listen 80;
    server_name localhost;
    
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for faster loading
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;
    gzip_disable "MSIE [1-6]\.";

    # Cache static assets (images, fonts, css, js)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|avif|svg|woff2?|eot|ttf|mp4)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Next.js static routing rules
    location / {
        # Try finding the exact file, then the .html version, then a directory, finally fallback to 404
        try_files $uri $uri.html $uri/ /404.html;
    }

    # Custom 404 page routing
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
